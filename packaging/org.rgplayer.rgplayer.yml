app-id: org.rgplayer.rgplayer
runtime: org.kde.Platform
runtime-version: "6.8"
sdk: org.kde.Sdk
command: rgplayer
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
modules:
  - name: rgplayer
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ..
